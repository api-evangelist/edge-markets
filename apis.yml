aid: edge-markets
name: Edge Markets
description: >-
  EDGE Markets builds financial infrastructure for high-throughput gaming and
  trading environments, positioning itself as the "financial backbone for a new
  asset class." Its product line spans EDGE Boost, a high-limit debit platform
  (up to a $1,000,000 daily limit) with built-in responsible-gaming controls and
  activity tracking; EDGE Connect, a private payment rail and closed-loop
  settlement layer that replaces traditional consumer card networks to cut
  transaction costs and chargebacks; and EDGE Pro, a banking platform (in
  development) for market makers and institutional investors. The company has
  raised a $29.2M Series A and partners with gaming and betting operators. As of
  this profile the company publishes a marketing and newsroom presence only — no
  public API, developer portal, or technical documentation surface has been
  found.
